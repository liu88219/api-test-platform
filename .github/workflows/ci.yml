name: PulseAPI Quality Gate & Daily Report Ledger

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "reports/DAILY_TEST_LEDGER.md"
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-platform-and-api-suites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Core Engine Unit & Integration Tests
        run: python3 -m unittest discover -s backend/tests -v

      - name: Execute All 8 Automated API Scenarios & Generate Report
        run: |
          python3 backend/cli_runner.py \
            --report-md "$GITHUB_STEP_SUMMARY" \
            --update-ledger reports/DAILY_TEST_LEDGER.md

      - name: Archive Periodic Test Ledger to Repository
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/DAILY_TEST_LEDGER.md
          git diff --staged --quiet || git commit -m "chore(qa-report): update daily automated test ledger [skip ci]"
          git push
